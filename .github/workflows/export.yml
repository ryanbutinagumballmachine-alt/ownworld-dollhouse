name: Build and Export Game

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.1"
  GODOT_STATUS: "stable"
  EXPORT_NAME: "OwnWorld_Dollhouse"

jobs:
  # ============================================================================
  # JOB 1: Windows Desktop Export
  # ============================================================================
  export-windows:
    name: 🪟 Export Windows Desktop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: ⚙️ Setup Godot & Export Templates
        run: |
          # 1. Prepare export template destination directory
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.${{ env.GODOT_STATUS }}"
          mkdir -p "$TEMPLATE_DIR"
          
          # 2. Download Godot Headless Engine & Templates (fail-fast with retries)
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}/Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}_linux.x86_64.zip" -o godot.zip
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}/Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}_export_templates.tpz" -o templates.tpz
          
          # 3. Extract and install Godot binary
          unzip -q godot.zip
          sudo mv Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          
          # 4. Extract and relocate export templates
          unzip -q templates.tpz
          mv templates/* "$TEMPLATE_DIR/"
          rm -rf templates godot.zip templates.tpz

      - name: 🔢 Synchronize Version Numbers & Sanitize Line Endings
        run: |
          # Remove carriage returns from Windows CRLF formatting to prevent regex breakage
          sed -i 's/\r$//' project.godot export_presets.cfg || true

          # 1. Update project.godot application version
          if grep -q "config/version=" project.godot; then
            sed -i 's/config\/version="[^"]*"/config\/version="1.0.${{ github.run_number }}"/g' project.godot
          else
            sed -i '/\[application\]/a config/version="1.0.${{ github.run_number }}"' project.godot
          fi

          # 2. Update Windows metadata in export_presets.cfg
          sed -i 's/application\/file_version="[^"]*"/application\/file_version="1.0.${{ github.run_number }}"/g' export_presets.cfg || true
          sed -i 's/application\/product_version="[^"]*"/application\/product_version="1.0.${{ github.run_number }}"/g' export_presets.cfg || true

      - name: 🔄 Pre-Import Assets (Headless Warm-up)
        run: |
          # Initialize .godot resource cache prior to packaging
          godot --headless --editor --quit || true

      - name: 🔨 Build Windows Export
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows Desktop" build/windows/${{ env.EXPORT_NAME }}.exe

      - name: 📦 Package Windows Zip
        run: |
          cd build/windows
          zip -r ../${{ env.EXPORT_NAME }}_Windows.zip .

      - name: 🚀 Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-Windows
          path: build/${{ env.EXPORT_NAME }}_Windows.zip
          retention-days: 14

  # ============================================================================
  # JOB 2: Android APK Export
  # ============================================================================
  export-android:
    name: 🤖 Export Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 📱 Setup Android SDK & Build Tools
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;34.0.0 platforms;android-34 cmdline-tools;latest"

      - name: 🌐 Export Android Build Tools to PATH
        run: |
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: 🔑 Validate Secrets & Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Verify all required Android signing credentials exist before proceeding
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error ::Missing ANDROID_KEYSTORE_BASE64 secret!"
            exit 1
          fi
          if [ -z "$STORE_PASS" ]; then
            echo "::error ::Missing ANDROID_KEYSTORE_PASSWORD secret!"
            exit 1
          fi
          if [ -z "$KEY_ALIAS" ]; then
            echo "::error ::Missing ANDROID_KEY_ALIAS secret!"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: ⚙️ Setup Godot & Export Templates
        run: |
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.${{ env.GODOT_STATUS }}"
          mkdir -p "$TEMPLATE_DIR"
          
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}/Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}_linux.x86_64.zip" -o godot.zip
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}/Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}_export_templates.tpz" -o templates.tpz
          
          unzip -q godot.zip
          sudo mv Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          
          unzip -q templates.tpz
          mv templates/* "$TEMPLATE_DIR/"
          rm -rf templates godot.zip templates.tpz

      - name: ⚙️ Configure Android Settings & Auto-Increment Version
        env:
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Sanitize line endings
          sed -i 's/\r$//' project.godot export_presets.cfg || true

          CONFIG_DIR="$HOME/.config/godot"
          mkdir -p "$CONFIG_DIR"
          
          # Configure Godot EditorSettings with Android SDK and Debug fallback path
          cat <<EOF > "$CONFIG_DIR/editor_settings-4.tres"
[gd_resource type="EditorSettings" format=3]

[resource]
export/android/android_sdk_path = "$ANDROID_HOME"
export/android/java_sdk_path = "$JAVA_HOME"
export/android/debug_keystore = "$GITHUB_WORKSPACE/release.keystore"
export/android/debug_keystore_user = "$KEY_ALIAS"
export/android/debug_keystore_pass = "$STORE_PASS"
export/android/shutdown_adb_on_exit = true
EOF

          # 1. Synchronize project version
          if grep -q "config/version=" project.godot; then
            sed -i 's/config\/version="[^"]*"/config\/version="1.0.${{ github.run_number }}"/g' project.godot
          else
            sed -i '/\[application\]/a config/version="1.0.${{ github.run_number }}"' project.godot
          fi

          # 2. Update Android Version Code & Version Name in export_presets.cfg
          sed -i "s/version\/code=.*/version\/code=${{ github.run_number }}/g" export_presets.cfg
          sed -i "s/version\/name=.*/version\/name=\"1.0.${{ github.run_number }}\"/g" export_presets.cfg

          # 3. Ensure ETC2/ASTC compression is enabled for mobile platforms
          if ! grep -q "textures/vram_compression/import_etc2_astc" project.godot; then
            if ! grep -q "\[rendering\]" project.godot; then
              printf "\n[rendering]\ntextures/vram_compression/import_etc2_astc=true\n" >> project.godot
            else
              sed -i '/\[rendering\]/a textures/vram_compression/import_etc2_astc=true' project.godot
            fi
          fi

      - name: 🔄 Pre-Import Assets & Mobile Texture Recompression
        run: |
          # Re-import assets headlessly for ETC2/ASTC mobile target
          godot --headless --editor --quit || true

      - name: 🔨 Build Android Release APK
        env:
          GODOT_ANDROID_SDK_PATH: ${{ env.ANDROID_HOME }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p build/android
          godot --headless --export-release "Android" build/android/${{ env.EXPORT_NAME }}.apk

      - name: 🚀 Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-Android-APK
          path: build/android/${{ env.EXPORT_NAME }}.apk
          retention-days: 14

  # ============================================================================
  # JOB 3: Publish GitHub Release
  # ============================================================================
  create-release:
    name: 🏷️ Publish GitHub Release
    needs: [export-windows, export-android]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: 🌟 Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Build v1.0.${{ github.run_number }}"
          files: |
            release/*.zip
            release/*.apk
          generate_release_notes: true
          make_latest: "true"