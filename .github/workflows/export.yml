name: Build and Export Game

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.1"
  GODOT_STATUS: "stable"
  EXPORT_NAME: "OwnWorld_Dollhouse"

jobs:
  # ============================================================================
  # JOB 1: Windows Desktop Export
  # ============================================================================
  export-windows:
    name: 🪟 Export Windows Desktop
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: ⚙️ Setup Godot & Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.${{ env.GODOT_STATUS }}
          wget -q https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}/Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}/Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}_export_templates.tpz
          
          unzip -q Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}_linux.x86_64.zip
          sudo mv Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}_linux.x86_64 /usr/local/bin/godot
          
          unzip -q Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.${{ env.GODOT_STATUS }}/
          rm -rf templates Godot_v*

      - name: 🔨 Build Windows Export
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows Desktop" build/windows/${{ env.EXPORT_NAME }}.exe

      - name: 📦 Package Windows Zip
        run: |
          cd build/windows
          zip -r ../${{ env.EXPORT_NAME }}_Windows.zip .

      - name: 🚀 Upload Windows Artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.EXPORT_NAME }}-Windows
          path: build/${{ env.EXPORT_NAME }}_Windows.zip
          retention-days: 14

  # ============================================================================
  # JOB 2: Android APK Export
  # ============================================================================
  export-android:
    name: 🤖 Export Android APK
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;34.0.0 platforms;android-34 cmdline-tools;latest"

      - name: 🔑 Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=AndroidDebug,O=Android,C=US"

      - name: ⚙️ Setup Godot & Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.${{ env.GODOT_STATUS }}
          wget -q https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}/Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}/Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}_export_templates.tpz
          
          unzip -q Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}_linux.x86_64.zip
          sudo mv Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}_linux.x86_64 /usr/local/bin/godot
          
          unzip -q Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.${{ env.GODOT_STATUS }}/
          rm -rf templates Godot_v*

      - name: ⚙️ Configure Godot Editor Settings & Textures
        run: |
          CONFIG_DIR="$HOME/.config/godot"
          mkdir -p "$CONFIG_DIR"
          
          SETTINGS_BODY=$(cat <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          EOF
          )
          
          MAJOR_MINOR=$(echo "${{ env.GODOT_VERSION }}" | cut -d. -f1,2)
          echo "$SETTINGS_BODY" > "$CONFIG_DIR/editor_settings-4.tres"
          echo "$SETTINGS_BODY" > "$CONFIG_DIR/editor_settings-${MAJOR_MINOR}.tres"
          echo "$SETTINGS_BODY" > "$CONFIG_DIR/editor_settings-${{ env.GODOT_VERSION }}.tres"

          # Ensure ETC2/ASTC compression is enabled in project.godot
          if ! grep -q "textures/vram_compression/import_etc2_astc" project.godot; then
            if ! grep -q "\[rendering\]" project.godot; then
              echo -e "\n[rendering]\ntextures/vram_compression/import_etc2_astc=true" >> project.godot
            else
              sed -i '/\[rendering\]/a textures/vram_compression/import_etc2_astc=true' project.godot
            fi
          fi

          # Re-import assets with the newly enabled compression format
          godot --headless --editor --quit-after 5 || true

      - name: 🔨 Build Android APK
        env:
          GODOT_ANDROID_SDK_PATH: ${{ env.ANDROID_HOME }}
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build/android
          godot --headless --export-debug "Android" build/android/${{ env.EXPORT_NAME }}.apk

      - name: 🚀 Upload Android Artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.EXPORT_NAME }}-Android-APK
          path: build/android/${{ env.EXPORT_NAME }}.apk
          retention-days: 14

  # ============================================================================
  # JOB 3: Automatic GitHub Releases (Triggers on Git tags: v*)
  # ============================================================================
  create-release:
    name: 🏷️ Publish GitHub Release
    needs: [export-windows, export-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Download Windows Artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.EXPORT_NAME }}-Windows
          path: release/

      - name: 📥 Download Android Artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.EXPORT_NAME }}-Android-APK
          path: release/

      - name: 🌟 Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true