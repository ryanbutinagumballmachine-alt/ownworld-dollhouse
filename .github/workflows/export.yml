name: Build and Export Game

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.1"
  GODOT_STATUS: "stable"
  EXPORT_NAME: "OwnWorld_Dollhouse"

permissions:
  contents: write

jobs:
  # ============================================================================
  # JOB 1: Synchronize, Bump & Commit Version Numbers
  # ============================================================================
  prepare-and-sync-version:
    name: 🔢 Synchronize & Commit Version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version_calc.outputs.version }}
      version_code: ${{ steps.version_calc.outputs.version_code }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Inject Version Keys into Godot Configs
        id: version_calc
        env:
          RUN_NUM: ${{ github.run_number }}
        run: |
          VERSION_STR="1.0.${RUN_NUM}"
          echo "version=${VERSION_STR}" >> "$GITHUB_OUTPUT"
          echo "version_code=${RUN_NUM}" >> "$GITHUB_OUTPUT"

          # Use Python to reliably update or insert keys without regex/CRLF corruption
          python3 - <<EOF
          import re, os

          run_number = os.environ["RUN_NUM"]
          version_str = f"1.0.{run_number}"

          # 1. Update project.godot
          if os.path.exists("project.godot"):
              with open("project.godot", "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()

              # Strip carriage returns
              content = content.replace("\r\n", "\n")

              # Update or insert config/version
              if "config/version=" in content:
                  content = re.sub(r'config/version="[^"]*"', f'config/version="{version_str}"', content)
              else:
                  content = re.sub(r'(\[application\][^\n]*\n)', rf'\1config/version="{version_str}"\n', content)

              # Ensure mobile texture compression is configured
              if "textures/vram_compression/import_etc2_astc" not in content:
                  if "[rendering]" in content:
                      content = re.sub(r'(\[rendering\][^\n]*\n)', r'\1textures/vram_compression/import_etc2_astc=true\n', content)
                  else:
                      content += "\n[rendering]\ntextures/vram_compression/import_etc2_astc=true\n"

              with open("project.godot", "w", encoding="utf-8") as f:
                  f.write(content)

          # 2. Update export_presets.cfg
          if os.path.exists("export_presets.cfg"):
              with open("export_presets.cfg", "r", encoding="utf-8", errors="ignore") as f:
                  cfg = f.read()

              cfg = cfg.replace("\r\n", "\n")

              # Update Windows metadata
              if "application/file_version=" in cfg:
                  cfg = re.sub(r'application/file_version="[^"]*"', f'application/file_version="{version_str}"', cfg)
              if "application/product_version=" in cfg:
                  cfg = re.sub(r'application/product_version="[^"]*"', f'application/product_version="{version_str}"', cfg)

              # Update Android version code & name
              if "version/code=" in cfg:
                  cfg = re.sub(r'version/code=\d+', f'version/code={run_number}', cfg)
              if "version/name=" in cfg:
                  cfg = re.sub(r'version/name="[^"]*"', f'version/name="{version_str}"', cfg)

              with open("export_presets.cfg", "w", encoding="utf-8") as f:
                  f.write(cfg)
          EOF

      - name: 💾 Commit & Push Version Changes to Repository
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add project.godot export_presets.cfg
          if ! git diff --staged --quiet; then
            git commit -m "chore(release): bump project version to 1.0.${{ github.run_number }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: 📦 Stash Configs for Export Jobs
        uses: actions/upload-artifact@v4
        with:
          name: versioned-configs
          path: |
            project.godot
            export_presets.cfg
          retention-days: 1

  # ============================================================================
  # JOB 2: Windows Desktop Export
  # ============================================================================
  export-windows:
    name: 🪟 Export Windows Desktop
    needs: [prepare-and-sync-version]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 🔄 Pull Injected Version Configs
        uses: actions/download-artifact@v4
        with:
          name: versioned-configs
          path: .

      - name: ⚙️ Setup Godot & Export Templates
        run: |
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.${{ env.GODOT_STATUS }}"
          mkdir -p "$TEMPLATE_DIR"
          
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}/Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}_linux.x86_64.zip" -o godot.zip
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}/Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}_export_templates.tpz" -o templates.tpz
          
          unzip -q godot.zip
          sudo mv Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          
          unzip -q templates.tpz
          mv templates/* "$TEMPLATE_DIR/"
          rm -rf templates godot.zip templates.tpz

      - name: 🔄 Pre-Import Assets (Headless Warm-up)
        run: |
          godot --headless --editor --quit || true

      - name: 🔨 Build Windows Export
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows Desktop" build/windows/${{ env.EXPORT_NAME }}.exe

      - name: 📦 Package Windows Zip
        run: |
          cd build/windows
          zip -r ../${{ env.EXPORT_NAME }}_Windows.zip .

      - name: 🚀 Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-Windows
          path: build/${{ env.EXPORT_NAME }}_Windows.zip
          retention-days: 14

  # ============================================================================
  # JOB 3: Android APK Export
  # ============================================================================
  export-android:
    name: 🤖 Export Android APK
    needs: [prepare-and-sync-version]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 🔄 Pull Injected Version Configs
        uses: actions/download-artifact@v4
        with:
          name: versioned-configs
          path: .

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 📱 Setup Android SDK & Build Tools
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;34.0.0 platforms;android-34 cmdline-tools;latest"

      - name: 🌐 Export Android Build Tools to PATH
        run: |
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: 🔑 Validate Secrets & Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error ::Missing ANDROID_KEYSTORE_BASE64 secret!"
            exit 1
          fi
          if [ -z "$STORE_PASS" ]; then
            echo "::error ::Missing ANDROID_KEYSTORE_PASSWORD secret!"
            exit 1
          fi
          if [ -z "$KEY_ALIAS" ]; then
            echo "::error ::Missing ANDROID_KEY_ALIAS secret!"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: ⚙️ Setup Godot & Export Templates
        run: |
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.${{ env.GODOT_STATUS }}"
          mkdir -p "$TEMPLATE_DIR"
          
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}/Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}_linux.x86_64.zip" -o godot.zip
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}/Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}_export_templates.tpz" -o templates.tpz
          
          unzip -q godot.zip
          sudo mv Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          
          unzip -q templates.tpz
          mv templates/* "$TEMPLATE_DIR/"
          rm -rf templates godot.zip templates.tpz

      - name: ⚙️ Configure Godot Android Settings
        env:
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          CONFIG_DIR="$HOME/.config/godot"
          mkdir -p "$CONFIG_DIR"
          
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "%s/release.keystore"\nexport/android/debug_keystore_user = "%s"\nexport/android/debug_keystore_pass = "%s"\nexport/android/shutdown_adb_on_exit = true\n' \
            "$ANDROID_HOME" "$JAVA_HOME" "$GITHUB_WORKSPACE" "$KEY_ALIAS" "$STORE_PASS" > "$CONFIG_DIR/editor_settings-4.tres"

      - name: 🔄 Pre-Import Assets & Mobile Texture Recompression
        run: |
          godot --headless --editor --quit || true

      - name: 🔨 Build Android Release APK
        env:
          GODOT_ANDROID_SDK_PATH: ${{ env.ANDROID_HOME }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p build/android
          godot --headless --export-release "Android" build/android/${{ env.EXPORT_NAME }}.apk

      - name: 🚀 Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-Android-APK
          path: build/android/${{ env.EXPORT_NAME }}.apk
          retention-days: 14

  # ============================================================================
  # JOB 4: Publish GitHub Release
  # ============================================================================
  create-release:
    name: 🏷️ Publish GitHub Release
    needs: [prepare-and-sync-version, export-windows, export-android]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: 🌟 Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.prepare-and-sync-version.outputs.version }}"
          name: "Build v${{ needs.prepare-and-sync-version.outputs.version }}"
          files: |
            release/*.zip
            release/*.apk
          generate_release_notes: true
          make_latest: "true"